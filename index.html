<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>KDEMA World</title>
<link rel="stylesheet" href="style.css?v=1.2" />
</head>
<body>
  <div id="ui">
    <div id="detail-row">
      <label for="detail-slider">Detail: <span id="detail-value"></span></label>
      <input type="range" id="detail-slider" min="0" max="3" step="1" value="1" />
    </div>

    <h1>KDEMA World</h1>
    <div id="shape-buttons">
      <button id="btn-ball" class="active">Ball</button>
      <button id="btn-block">Block</button>
    </div>
    <button id="btn-reset">Reset Shape</button>

    <label id="mirror-toggle">
      <input type="checkbox" id="chk-mirror" />
      Mirror
    </label>

    <div id="brush-row">
      <label for="brush-size">Brush Size</label>
      <input type="range" id="brush-size" min="0.2" max="1.3" step="0.05" value="0.85" />
      <label for="brush-hardness">Hardness</label>
      <input type="range" id="brush-hardness" min="0" max="1" step="0.05" value="0" />
    </div>

    <div id="brush-shape-buttons">
      <button class="shape-btn active" data-shape="circle">Circle</button>
      <button class="shape-btn" data-shape="square">Square</button>
      <button class="shape-btn" data-shape="rectangle">Rectangle</button>
      <button class="shape-btn" data-shape="oval">Oval</button>
    </div>

    <div id="color-swatches" role="group" aria-label="Color"></div>

    <div id="pattern-buttons">
      <button id="btn-pattern-solid" class="pattern-btn active" data-pattern="solid">Solid</button>
      <button id="btn-pattern-dots" class="pattern-btn" data-pattern="dots">Dots</button>
      <button id="btn-pattern-stripes" class="pattern-btn" data-pattern="stripes">Stripes</button>
    </div>

    <p id="hint">Grab a point and drag up to puff it out, drag down to push it in. Drag empty space to rotate.</p>

    <div id="save-row">
      <button id="btn-save">Save Character</button>
    </div>
    <div id="gallery-label">My Characters</div>
    <div id="character-gallery"></div>
  </div>
  <canvas id="scene"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js?v=1.2"></script>
</body>
</html>
